alb:
  ingressClass: alb
  scheme: internet-facing
  targetType: ip
  subnets:
    - subnet-01fba20a8f2a742fa
    - subnet-0d43dd1f59b2c6d3d
  healthCheck:
    path: /health
    protocol: HTTP
    port: traffic-port
    intervalSeconds: 15
    timeoutSeconds: 5
    healthyThresholdCount: 2
    unhealthyThresholdCount: 2
  tags:
    Environment: production
    Team: platform

# Service Account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

apps:
  - name: app1
    path: /app1
    image: <your-ecr-image-url-for-app1>
    replicas: 2
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    healthCheck:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3
    env: {}
    
  - name: app2
    path: /app2
    image: <your-ecr-image-url-for-app2>
    replicas: 2
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    healthCheck:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3
    env: {}
    
  - name: app3
    path: /app3
    image: <your-ecr-image-url-for-app3>
    replicas: 2
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    healthCheck:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3
    env: {}

# Global settings
global:
  nameOverride: ""
  fullnameOverride: ""
  
# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 80

# Ingress configuration
ingress:
  enabled: true
  className: alb
  tls: []