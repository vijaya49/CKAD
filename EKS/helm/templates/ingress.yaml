{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "multi-apps.fullname" . }}-ingress
  labels:
    {{- include "multi-apps.labels" . | nindent 4 }}
  annotations:
    # ALB Configuration
    alb.ingress.kubernetes.io/scheme: {{ .Values.alb.scheme }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.alb.targetType }}
    alb.ingress.kubernetes.io/subnets: {{ join "," .Values.alb.subnets }}
    
    # Health Check Configuration
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.alb.healthCheck.path | default "/" }}
    alb.ingress.kubernetes.io/healthcheck-protocol: {{ .Values.alb.healthCheck.protocol | default "HTTP" }}
    alb.ingress.kubernetes.io/healthcheck-port: {{ .Values.alb.healthCheck.port | default "traffic-port" }}
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: {{ .Values.alb.healthCheck.intervalSeconds | default "15" | quote }}
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: {{ .Values.alb.healthCheck.timeoutSeconds | default "5" | quote }}
    alb.ingress.kubernetes.io/healthy-threshold-count: {{ .Values.alb.healthCheck.healthyThresholdCount | default "2" | quote }}
    alb.ingress.kubernetes.io/unhealthy-threshold-count: {{ .Values.alb.healthCheck.unhealthyThresholdCount | default "2" | quote }}
    
    # ALB Listener Configuration
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    
    # Load Balancer Attributes
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
    
    {{- if .Values.alb.tags }}
    # Tags
    alb.ingress.kubernetes.io/tags: {{ range $key, $value := .Values.alb.tags }}{{ $key }}={{ $value }},{{ end }}
    {{- end }}
    
    # Additional annotations for better routing
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=false,deregistration_delay.timeout_seconds=60
spec:
  ingressClassName: {{ .Values.alb.ingressClass }}
  rules:
    - http:
        paths:
{{- range .Values.apps }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ .name }}-service
                port:
                  number: {{ $.Values.service.port | default 80 }}
{{- end }}
{{- end }}